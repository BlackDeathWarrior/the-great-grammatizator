{% for t in a.content.tweets %}
<div class="item">
  <p class="prose" style="margin:0">{{ t }}</p>
  {# The deterministic checker enforces this; showing the count makes it legible #}
  <span class="muted num" style="font-size:.75rem">{{ t|length }}/280</span>
</div>
{% endfor %}
{% if a.content.hashtags %}
<p class="muted">{{ a.content.hashtags|join(' ') }}</p>
{% endif %}
