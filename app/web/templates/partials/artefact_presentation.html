<h3 style="margin-top:0">{{ a.content.title }}</h3>
{% for s in a.content.slides %}
<div style="border:1px solid var(--line);border-radius:6px;padding:.75rem;margin-bottom:.5rem">
  <strong>{{ loop.index }}. {{ s.heading }}</strong>
  <ul style="margin:.5rem 0">{% for b in s.bullets %}<li>{{ b }}</li>{% endfor %}</ul>
  {# Speaker notes are half the deliverable; a deck without them is unusable #}
  <p class="muted" style="font-size:.8125rem;margin:0"><em>Notes:</em> {{ s.speaker_notes }}</p>
</div>
{% endfor %}
