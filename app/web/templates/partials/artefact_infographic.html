{# Panels, drawn as panels. The statistic is the largest thing in each one
   because that is what an infographic panel is for, and the caption sits
   under it at reading size. #}
<h3 class="info-headline">{{ a.content.headline }}</h3>
<div class="panels">
  {% for p in a.content.panels %}
  <figure class="ipanel">
    <div class="ipanel-stat num">{{ p.stat }}</div>
    <figcaption>
      <strong>{{ p.heading }}</strong>
      <span>{{ p.caption }}</span>
    </figcaption>
  </figure>
  {% endfor %}
</div>
<p class="layout-note"><span class="label">Layout</span> {{ a.content.layout_recommendation }}</p>
