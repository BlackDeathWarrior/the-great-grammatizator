<h3>{{ a.content.headline }}</h3>
<div class="grid">
  {% for p in a.content.panels %}
  <div class="item" style="text-align:center">
    <div class="num" style="font-size:var(--step-2);font-weight:700;color:var(--accent)">{{ p.stat }}</div>
    <div style="font-weight:600">{{ p.heading }}</div>
    <div class="muted" style="font-size:var(--step--1)">{{ p.caption }}</div>
  </div>
  {% endfor %}
</div>
<p class="muted" style="margin-top:.75rem"><strong>Layout:</strong>
  {{ a.content.layout_recommendation }}</p>
