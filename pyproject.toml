[project]
name = "content-transform"
version = "0.1.0"
description = "Gen AI platform for automated content transformation"
requires-python = ">=3.11,<3.12"

dependencies = [
    # API + web (layer 1, 2)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # persistence
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",

    # queue (layer 2 - "the queue is where rate limiting and backoff live")
    "arq>=0.26",
    "redis>=5.2",

    # vector store
    "qdrant-client>=1.12",

    # gateway (layer 3) - the ONLY module allowed to name a provider
    "litellm>=1.53",
    # Embeddings SDK, called DIRECTLY from app/ingest/embed.py, bypassing the
    # router by design (ARCHITECTURE.md sec.2, TC-0905).
    "openai>=1.55",

    # orchestration (layer 4)
    "langgraph>=0.2.45",
    "langchain-text-splitters>=0.3",

    # ingestion (layer 2) - deterministic, no LLM
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "trafilatura>=1.12",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    # faster-whisper, not openai-whisper: same models via CTranslate2 with no
    # torch dependency. Keeps the image under 1GB and rebuilds fast.
    "faster-whisper>=1.1",

    # schema validation
    "jsonschema>=4.23",

    # export (layer 9)
    "python-pptx>=1.0",
    "reportlab>=4.2",
    "edge-tts>=6.1",

    # observability (layer 10)
    "langfuse>=2.53",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Docs contain illustrative python snippets; they are spec, not source.
extend-exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI requires Depends/File/Form calls in argument defaults; B008 is a
# false positive against the framework idiom.
"app/api/*.py" = ["B008"]
"app/web/*.py" = ["B008"]

[tool.ruff.lint.isort]
# `alembic/` is a local directory but the import is the third-party package.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "p0: blocks the demo (TEST-CASES.md priority P0)",
    "p1: should pass",
    "p2: nice to have",
    "integration: requires docker services up",
    "e2e: full pipeline, requires provider keys",
]
