# ARCHITECTURE.md §11, plus redis + worker for the job queue.
#
# Two things that cost time if missed (§11):
#   1. Inside the app container, address services by NAME (http://qdrant:6333),
#      never localhost.                                            [TC-1107]
#   2. Mount the volumes, or embeddings vanish on every `down` and
#      you re-ingest before every run.                             [TC-1106]

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["./qdrant_storage:/qdrant/storage"]
    healthcheck:
      # qdrant images ship no curl/wget; use the bundled entrypoint binary.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: ["./pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["./redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://postgres:dev@postgres:5432/app
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/storage
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - storage:/data/storage
    depends_on:
      qdrant: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: [.env]
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://postgres:dev@postgres:5432/app
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/storage
    volumes:
      - ./app:/app/app
      - storage:/data/storage
    depends_on:
      qdrant: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  storage:
